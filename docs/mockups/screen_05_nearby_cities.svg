<text x="24" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#16202b">1. Тула — 172 км</text>
<text x="24" y="183" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#16202b">2. Калуга — 250 км</text>
