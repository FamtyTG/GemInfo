<text x="24" y="219" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#16202b">4. Рязань — 341 км</text>
<text x="24" y="237" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#16202b">5. Тверь — 411 км</text>
<text x="24" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#16202b"></text>
<text x="24" y="273" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#16202b">Выберите город кнопкой ниже.</text>
