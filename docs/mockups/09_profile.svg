<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>Экран 9. Моя анкета</title><rect width="375" height="812" fill="#EFEFF4" /><rect x="0" y="0" width="375" height="74" fill="#FFFFFF" /><line x1="0" y1="74" x2="375" y2="74" stroke="#D1D1D6" /><text x="187.5" y="32" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E">GameHunter</text><text x="187.5" y="52" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8E8E93">@GameHunterBot · в сети</text><text x="187.5" y="804" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8E8E93">Экран 9. Моя анкета — GameHunter</text><rect x="12" y="90" width="351" height="392" rx="16" fill="#FFFFFF" /><text x="26" y="114" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#2481CC">GameHunter</text><text x="26" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E" font-weight="600">Моя анкета:</text><text x="26" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E"></text><text x="26" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Возраст: 27 лет</text><text x="26" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Интересы (жанры): Action, RPG</text><text x="26" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Платформы: PC, PlayStation</text><text x="26" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Регион: Kazan, Tatarstan Republic, Russia</text><text x="26" y="242" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">страна: RU</text><text x="26" y="260" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">часовой пояс: Europe/Moscow</text><text x="26" y="278" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">валюта: RUB</text><text x="26" y="296" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">определён по IP: 5.188.0.1</text><text x="26" y="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E"></text><text x="26" y="332" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E" font-weight="600">Анкета используется при подборе игр:</text><text x="26" y="350" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">• возраст — чтобы не показывать игры не по</text><text x="26" y="368" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">возрасту;</text><text x="26" y="386" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">• интересы и платформы — чтобы предлагать</text><text x="26" y="404" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">подходящие игры;</text><text x="26" y="422" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">• регион — чтобы показывать доступные</text><text x="26" y="440" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">магазины и валюту.</text><text x="26" y="458" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8E8E93">Анкета применяется как фильтр по умолчанию</text><text x="26" y="474" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8E8E93">при подборе игр.</text><rect x="12" y="494" width="146" height="34" rx="10" fill="#FFFFFF" stroke="#C7C7CC" stroke-width="1" /><text x="85.0" y="516" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2481CC">Указать возраст</text><rect x="166" y="494" width="138" height="34" rx="10" fill="#FFFFFF" stroke="#C7C7CC" stroke-width="1" /><text x="235.0" y="516" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2481CC">Убрать возраст</text><rect x="12" y="536" width="154" height="34" rx="10" fill="#FFFFFF" stroke="#C7C7CC" stroke-width="1" /><text x="89.0" y="558" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2481CC">Выбрать интересы</text><rect x="174" y="536" width="162" height="34" rx="10" fill="#FFFFFF" stroke="#C7C7CC" stroke-width="1" /><text x="255.0" y="558" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2481CC">Выбрать платформы</text><rect x="12" y="578" width="210" height="34" rx="10" fill="#FFFFFF" stroke="#C7C7CC" stroke-width="1" /><text x="117.0" y="600" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2481CC">Определить регион по IP</text><rect x="230" y="578" width="130" height="34" rx="10" fill="#FFFFFF" stroke="#C7C7CC" stroke-width="1" /><text x="295.0" y="600" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2481CC">Убрать регион</text><rect x="12" y="620" width="351" height="34" rx="10" fill="#FFFFFF" stroke="#C7C7CC" stroke-width="1" /><text x="187.5" y="642" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2481CC">В главное меню</text></svg>