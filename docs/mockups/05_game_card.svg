<svg xmlns="http://www.w3.org/2000/svg" width="375" height="912" viewBox="0 0 375 912" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>Экран 5. Карточка игры</title><rect width="375" height="912" fill="#EFEFF4" /><rect x="0" y="0" width="375" height="74" fill="#FFFFFF" /><line x1="0" y1="74" x2="375" y2="74" stroke="#D1D1D6" /><text x="187.5" y="32" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E">GameHunter</text><text x="187.5" y="52" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8E8E93">@GameHunterBot · в сети</text><text x="187.5" y="904" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8E8E93">Экран 5. Карточка игры — GameHunter</text><rect x="12" y="90" width="351" height="670" rx="16" fill="#FFFFFF" /><text x="26" y="114" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#2481CC">GameHunter</text><rect x="26" y="134" width="323" height="134" rx="10" fill="#DDE3EA" /><text x="187.5" y="201.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6B7280">обложка игры (фото из каталога)</text><text x="26" y="284" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E" font-weight="600">Карточка игры:</text><text x="26" y="302" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E"></text><text x="26" y="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Название: The Witcher 3: Wild Hunt</text><text x="26" y="338" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Выход: 19.05.2015</text><text x="26" y="356" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Рейтинг: 4.6 · Metacritic 93</text><text x="26" y="374" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Жанры: RPG, Action, Adventure</text><text x="26" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Платформы: PC, PlayStation 4, Xbox One,</text><text x="26" y="410" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Nintendo Switch</text><text x="26" y="428" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Возрастной рейтинг: M (17+)</text><text x="26" y="446" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Разработчик: CD PROJEKT RED</text><text x="26" y="464" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Издатель: CD PROJEKT RED</text><text x="26" y="482" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Среднее время прохождения: 50 ч.</text><text x="26" y="500" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Магазины: Steam, GOG, PlayStation Store</text><text x="26" y="518" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Метки: Открытый мир, Сюжет, Славянское</text><text x="26" y="536" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">фэнтези</text><text x="26" y="554" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Ваш регион: Kazan, Tatarstan Republic,</text><text x="26" y="572" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Russia, валюта RUB</text><text x="26" y="590" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E"></text><text x="26" y="608" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">✔ Вы уже играли в эту игру.</text><text x="26" y="626" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">★ Игра в избранном.</text><text x="26" y="644" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E"></text><text x="26" y="662" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Третья часть серии игр по книгам Анджея</text><text x="26" y="680" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Сапковского. Герой ищет Цириллу, а заодно</text><text x="26" y="698" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">выполняет контракты на чудовищ: открытый</text><text x="26" y="716" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">мир, сюжетные выборы и карточная игра в</text><text x="26" y="734" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">гвинт.</text><text x="26" y="752" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8E8E93">Описание игры сокращается до 400 символов.</text><rect x="12" y="772" width="110" height="34" rx="10" fill="#FFFFFF" stroke="#C7C7CC" stroke-width="1" /><text x="67.0" y="794" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2481CC">Уже играл</text><rect x="130" y="772" width="186" height="34" rx="10" fill="#FFFFFF" stroke="#C7C7CC" stroke-width="1" /><text x="223.0" y="794" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2481CC">Убрать из избранного</text><rect x="12" y="814" width="110" height="34" rx="10" fill="#FFFFFF" stroke="#C7C7CC" stroke-width="1" /><text x="67.0" y="836" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2481CC">Назад</text><rect x="130" y="814" width="138" height="34" rx="10" fill="#FFFFFF" stroke="#C7C7CC" stroke-width="1" /><text x="199.0" y="836" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2481CC">В главное меню</text></svg>