<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>Экран 9б. Интересы в анкете</title><rect width="375" height="812" fill="#EFEFF4" /><rect x="0" y="0" width="375" height="74" fill="#FFFFFF" /><line x1="0" y1="74" x2="375" y2="74" stroke="#D1D1D6" /><text x="187.5" y="32" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E">GameHunter</text><text x="187.5" y="52" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8E8E93">@GameHunterBot · в сети</text><text x="187.5" y="804" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8E8E93">Экран 9б. Интересы в анкете — GameHunter</text><rect x="12" y="90" width="351" height="324" rx="16" fill="#FFFFFF" /><text x="26" y="114" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#2481CC">GameHunter</text><text x="26" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Выберите жанры для своей анкеты (можно</text><text x="26" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E" font-weight="600">несколько):</text><text x="26" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E"></text><text x="26" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">✔ Action</text><text x="26" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">✔ RPG</text><text x="26" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Adventure</text><text x="26" y="242" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Shooter</text><text x="26" y="260" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Strategy</text><text x="26" y="278" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Racing</text><text x="26" y="296" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Puzzle</text><text x="26" y="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Arcade</text><text x="26" y="332" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E"></text><text x="26" y="350" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Выбрано: Action, RPG</text><text x="26" y="368" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Отмеченные жанры будут использоваться при</text><text x="26" y="386" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">подборе игр.</text><text x="26" y="404" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Когда закончите — нажмите «Сохранить».</text><rect x="12" y="426" width="110" height="34" rx="10" fill="#FFFFFF" stroke="#C7C7CC" stroke-width="1" /><text x="67.0" y="448" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2481CC">✔ Action</text><rect x="130" y="426" width="110" height="34" rx="10" fill="#FFFFFF" stroke="#C7C7CC" stroke-width="1" /><text x="185.0" y="448" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2481CC">✔ RPG</text><rect x="12" y="468" width="110" height="34" rx="10" fill="#FFFFFF" stroke="#C7C7CC" stroke-width="1" /><text x="67.0" y="490" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2481CC">Adventure</text><rect x="130" y="468" width="110" height="34" rx="10" fill="#FFFFFF" stroke="#C7C7CC" stroke-width="1" /><text x="185.0" y="490" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2481CC">Shooter</text><rect x="12" y="510" width="110" height="34" rx="10" fill="#FFFFFF" stroke="#C7C7CC" stroke-width="1" /><text x="67.0" y="532" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2481CC">Strategy</text><rect x="130" y="510" width="110" height="34" rx="10" fill="#FFFFFF" stroke="#C7C7CC" stroke-width="1" /><text x="185.0" y="532" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2481CC">Racing</text><rect x="12" y="552" width="110" height="34" rx="10" fill="#FFFFFF" stroke="#C7C7CC" stroke-width="1" /><text x="67.0" y="574" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2481CC">Puzzle</text><rect x="130" y="552" width="110" height="34" rx="10" fill="#FFFFFF" stroke="#C7C7CC" stroke-width="1" /><text x="185.0" y="574" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2481CC">Arcade</text><rect x="12" y="594" width="110" height="34" rx="10" fill="#FFFFFF" stroke="#C7C7CC" stroke-width="1" /><text x="67.0" y="616" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2481CC">Сохранить</text><rect x="130" y="594" width="110" height="34" rx="10" fill="#FFFFFF" stroke="#C7C7CC" stroke-width="1" /><text x="185.0" y="616" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2481CC">Назад</text></svg>