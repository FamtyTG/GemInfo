<svg xmlns="http://www.w3.org/2000/svg" width="400" height="384" viewBox="0 0 400 384">
  <rect width="400" height="384" fill="#e7ebf0"/>
  <rect width="400" height="56" fill="#2a76c6"/>
  <text x="14" y="26" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff">TravelHunter</text>
  <text x="14" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#dce8f6">Экран 8. История поездок — информация о поездке</text>
  <text x="266" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#dce8f6">@TravelHunterBot</text>
  <rect x="14" y="70" width="372" height="110" rx="12" fill="#ffffff" stroke="#c9d3dd"/>
<text x="24" y="93" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#16202b" font-weight="600">Информация о поездке:</text>
<text x="24" y="111" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#16202b"></text>
<text x="24" y="129" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#16202b">Дата поездки: 10.08.2026</text>
<text x="24" y="147" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#16202b">Город: Тула</text>
<text x="24" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#16202b">Заметка о поездке отсутствует.</text>
  <rect x="14" y="196" width="372" height="34" rx="8" fill="#d9ebff" stroke="#7aa9de"/>
<text x="26" y="218" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#123f6d">Написать заметку</text>
<rect x="14" y="234" width="372" height="34" rx="8" fill="#d9ebff" stroke="#7aa9de"/>
<text x="26" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#123f6d">Назад</text>
<rect x="14" y="272" width="372" height="34" rx="8" fill="#d9ebff" stroke="#7aa9de"/>
<text x="26" y="294" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#123f6d">В главное меню</text>
  <text x="14" y="337" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5c6b7a">Если заметка есть, вместо «Заметка о поездке отсутствует.»</text>
<text x="14" y="355" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5c6b7a">показывается её текст.</text>
</svg>
