<svg xmlns="http://www.w3.org/2000/svg" width="400" height="626" viewBox="0 0 400 626">
  <rect width="400" height="626" fill="#e7ebf0"/>
  <rect width="400" height="56" fill="#2a76c6"/>
  <text x="14" y="26" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff">TravelHunter</text>
  <text x="14" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#dce8f6">Экран 7. История поездок — список поездок</text>
  <text x="266" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#dce8f6">@TravelHunterBot</text>
  <rect x="14" y="70" width="372" height="200" rx="12" fill="#ffffff" stroke="#c9d3dd"/>
<text x="24" y="93" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#16202b" font-weight="600">История поездок:</text>
<text x="24" y="111" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#16202b">Страница 1 из 2</text>
<text x="24" y="129" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#16202b"></text>
<text x="24" y="147" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#16202b">1. 10.08.2026 — Москва</text>
<text x="24" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#16202b">2. 03.08.2026 — Калуга</text>
<text x="24" y="183" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#16202b">3. 25.07.2026 — Орёл</text>
<text x="24" y="201" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#16202b">4. 18.07.2026 — Тула</text>
<text x="24" y="219" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#16202b">5. 11.07.2026 — Рязань</text>
<text x="24" y="237" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#16202b"></text>
<text x="24" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#16202b">Выберите поездку, чтобы посмотреть подробности.</text>
  <rect x="14" y="286" width="372" height="34" rx="8" fill="#d9ebff" stroke="#7aa9de"/>
<text x="26" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#123f6d">Выбрать город 1</text>
<rect x="14" y="324" width="372" height="34" rx="8" fill="#d9ebff" stroke="#7aa9de"/>
<text x="26" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#123f6d">Выбрать город 2</text>
<rect x="14" y="362" width="372" height="34" rx="8" fill="#d9ebff" stroke="#7aa9de"/>
<text x="26" y="384" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#123f6d">Выбрать город 3</text>
<rect x="14" y="400" width="372" height="34" rx="8" fill="#d9ebff" stroke="#7aa9de"/>
<text x="26" y="422" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#123f6d">Выбрать город 4</text>
<rect x="14" y="438" width="372" height="34" rx="8" fill="#d9ebff" stroke="#7aa9de"/>
<text x="26" y="460" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#123f6d">Выбрать город 5</text>
<rect x="14" y="476" width="372" height="34" rx="8" fill="#d9ebff" stroke="#7aa9de"/>
<text x="26" y="498" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#123f6d">Вперёд</text>
<rect x="14" y="514" width="372" height="34" rx="8" fill="#d9ebff" stroke="#7aa9de"/>
<text x="26" y="536" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#123f6d">В главное меню</text>
  <text x="14" y="579" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5c6b7a">На первой странице нет кнопки «Назад», на последней — «Вперёд».</text>
<text x="14" y="597" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5c6b7a">Если поездок нет: «История поездок пока пуста…»</text>
</svg>
