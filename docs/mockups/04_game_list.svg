<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>Экран 4. Подборка игр</title><rect width="375" height="812" fill="#EFEFF4" /><rect x="0" y="0" width="375" height="74" fill="#FFFFFF" /><line x1="0" y1="74" x2="375" y2="74" stroke="#D1D1D6" /><text x="187.5" y="32" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E">GameHunter</text><text x="187.5" y="52" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8E8E93">@GameHunterBot · в сети</text><text x="187.5" y="804" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8E8E93">Экран 4. Подборка игр — GameHunter</text><rect x="12" y="90" width="351" height="356" rx="16" fill="#FFFFFF" /><text x="26" y="114" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#2481CC">GameHunter</text><text x="26" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E" font-weight="600">Подборка игр для Вас:</text><text x="26" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E"></text><text x="26" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Фильтры: жанры: Action, RPG; платформы: PC,</text><text x="26" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">PlayStation; возраст: 27</text><text x="26" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Страница 1 из 3</text><text x="26" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Игры, в которые Вы уже играли, исключены из</text><text x="26" y="242" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">подборки.</text><text x="26" y="260" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E"></text><text x="26" y="278" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">1. The Witcher 3: Wild Hunt</text><text x="26" y="296" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">2015 · рейтинг 4.6 · RPG</text><text x="26" y="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">2. God of War</text><text x="26" y="332" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">2018 · рейтинг 4.5 · Action</text><text x="26" y="350" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">3. Cyberpunk 2077</text><text x="26" y="368" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">2020 · рейтинг 4.3 · RPG</text><text x="26" y="386" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E"></text><text x="26" y="404" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Выберите игру, чтобы посмотреть карточку.</text><text x="26" y="422" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8E8E93">Сыгранные игры исключены из подборки</text><text x="26" y="438" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8E8E93">автоматически.</text><rect x="12" y="458" width="351" height="34" rx="10" fill="#FFFFFF" stroke="#C7C7CC" stroke-width="1" /><text x="187.5" y="480" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2481CC">Выбрать игру 1</text><rect x="12" y="500" width="351" height="34" rx="10" fill="#FFFFFF" stroke="#C7C7CC" stroke-width="1" /><text x="187.5" y="522" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2481CC">Выбрать игру 2</text><rect x="12" y="542" width="351" height="34" rx="10" fill="#FFFFFF" stroke="#C7C7CC" stroke-width="1" /><text x="187.5" y="564" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2481CC">Выбрать игру 3</text><rect x="12" y="584" width="351" height="34" rx="10" fill="#FFFFFF" stroke="#C7C7CC" stroke-width="1" /><text x="187.5" y="606" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2481CC">Вперёд</text><rect x="12" y="626" width="351" height="34" rx="10" fill="#FFFFFF" stroke="#C7C7CC" stroke-width="1" /><text x="187.5" y="648" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2481CC">Другие жанры</text><rect x="12" y="668" width="351" height="34" rx="10" fill="#FFFFFF" stroke="#C7C7CC" stroke-width="1" /><text x="187.5" y="690" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2481CC">В главное меню</text></svg>