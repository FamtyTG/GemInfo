<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>Экран 9г. Регион по IP-адресу</title><rect width="375" height="812" fill="#EFEFF4" /><rect x="0" y="0" width="375" height="74" fill="#FFFFFF" /><line x1="0" y1="74" x2="375" y2="74" stroke="#D1D1D6" /><text x="187.5" y="32" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E">GameHunter</text><text x="187.5" y="52" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8E8E93">@GameHunterBot · в сети</text><text x="187.5" y="804" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8E8E93">Экран 9г. Регион по IP-адресу — GameHunter</text><rect x="12" y="90" width="351" height="174" rx="16" fill="#FFFFFF" /><text x="26" y="114" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#2481CC">GameHunter</text><text x="26" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Пришлите Ваш публичный IP-адрес — по нему</text><text x="26" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">бот определит страну, город,</text><text x="26" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">часовой пояс и валюту.</text><text x="26" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Узнать свой IP-адрес можно на сайте 2ip.ru.</text><text x="26" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Пример: 8.8.8.8</text><text x="26" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8E8E93">Telegram Bot API не передаёт IP</text><text x="26" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8E8E93">пользователя, поэтому адрес нужно прислать</text><text x="26" y="256" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8E8E93">вручную.</text><text x="187.5" y="772" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8E8E93">обычная клавиатура скрыта — пользователь вводит текст</text></svg>