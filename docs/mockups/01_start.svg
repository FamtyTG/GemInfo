<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="Segoe UI, Helvetica, Arial, sans-serif"><title>Экран 1. Приветствие</title><rect width="375" height="812" fill="#EFEFF4" /><rect x="0" y="0" width="375" height="74" fill="#FFFFFF" /><line x1="0" y1="74" x2="375" y2="74" stroke="#D1D1D6" /><text x="187.5" y="32" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1C1C1E">GameHunter</text><text x="187.5" y="52" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8E8E93">@GameHunterBot · в сети</text><text x="187.5" y="804" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8E8E93">Экран 1. Приветствие — GameHunter</text><rect x="12" y="90" width="351" height="176" rx="16" fill="#FFFFFF" /><text x="26" y="114" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#2481CC">GameHunter</text><text x="26" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Добро пожаловать в GameHunter</text><text x="26" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Чат-бот, который помогает подобрать</text><text x="26" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">видеоигру по интересам, жанрам, возрасту и</text><text x="26" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">франшизе (IP).</text><text x="26" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">/start — переведёт Вас в главное меню, где</text><text x="26" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">бы Вы ни находились.</text><text x="26" y="242" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8E8E93">Показывается один раз при первом запуске</text><text x="26" y="258" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8E8E93">бота (команда /start).</text><rect x="0" y="744" width="375" height="68" fill="#F7F7F7" /><line x1="0" y1="744" x2="375" y2="744" stroke="#D1D1D6" /><rect x="12" y="756" width="343" height="44" rx="10" fill="#FFFFFF" stroke="#C7C7CC" stroke-width="1" /><text x="183.5" y="784" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1C1C1E">Старт</text></svg>