services:
  # PostgreSQL для локальной разработки Telegram-бота GameHunter.
  # Запуск:  docker compose up -d
  # Остановка: docker compose down       (данные сохранятся в volume)
  postgres:
    image: postgres:16-alpine
    container_name: gamehunter-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gamehunter
      TZ: Europe/Moscow
    ports:
      - "5432:5432"
    volumes:
      - gamehunter_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gamehunter"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Админка для просмотра таблиц (необязательно): http://localhost:8080
  adminer:
    image: adminer:4
    container_name: gamehunter-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  gamehunter_pgdata:
